name: 기능 제안 / Feature request
description: 새 기능이나 개선을 제안해 주세요. / Suggest a new feature or an improvement.
labels: ["enhancement", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        README의 [향후 개선 계획](https://github.com/gajigaji-dev/ByteSieve#향후-개선-계획미구현)에 이미 있는지 먼저 확인해 주세요.
        Please check the planned improvements in the README first.
  - type: textarea
    id: problem
    attributes:
      label: 해결하고 싶은 문제 / Problem
      description: 지금 어떤 점이 불편한지, 어떤 상황에서 필요한지 적어 주세요. / What is hard to do today, and when do you need it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 방법 / Proposal
      description: 원하는 동작이나 화면을 적어 주세요. / Describe the behavior or UI you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 생각해 본 다른 방법 / Alternatives considered
  - type: checkboxes
    id: safety
    attributes:
      label: 확인 / Checks
      options:
        - label: 파일을 지우거나 옮기는 기능이라면, 영구 삭제는 사용자가 직접 확인한 경우에만 해야 한다는 원칙을 알고 있습니다. / If this deletes or moves files, I understand permanent deletion must only happen after explicit user confirmation.
        - label: 직접 구현해 PR을 보낼 의향이 있습니다. / I am willing to open a pull request for this.
