# ByteSieve Issue·PR 라벨 목록 (참고용)
# 이 파일은 GitHub에 자동으로 반영되지 않는다. 라벨을 만들거나 고칠 때 기준으로 쓴다.
#   gh label create <name> --color <color> --description "<description>"
# Issue 양식(.github/ISSUE_TEMPLATE/*.yml)의 labels 에 적은 라벨이 저장소에 없으면 GitHub가 조용히 건너뛴다.

